name: CI

on:
  # Every branch. No filter: a check that only runs on some branches is a check you cannot rely on,
  # and there is nothing here worth withholding from a work-in-progress branch.
  push:
  # Only adds anything for forks, which have no push event in this repo. Same-repo PRs are already
  # covered by their push, so the jobs skip that duplicate — see the `if` on each one.
  pull_request:
  # So a run can be kicked off by hand from the Actions tab without pushing anything.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: node .yarn/releases/yarn-4.10.3.cjs install --immutable
      - run: node .yarn/releases/yarn-4.10.3.cjs format:check
      - run: node .yarn/releases/yarn-4.10.3.cjs lint
      - run: node .yarn/releases/yarn-4.10.3.cjs typecheck
      - run: node .yarn/releases/yarn-4.10.3.cjs test
      - run: node .yarn/releases/yarn-4.10.3.cjs workspace @satellite-mock/webui build

  e2e:
    # The UI has no other automated coverage, and the bugs it catches — a trace full of keepalives,
    # a claim code overwritten on small surfaces — were all invisible to the unit tests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: node .yarn/releases/yarn-4.10.3.cjs install --immutable
      - run: node .yarn/releases/yarn-4.10.3.cjs build
      - run: node .yarn/releases/yarn-4.10.3.cjs workspace @satellite-mock/webui build
      - run: node .yarn/releases/yarn-4.10.3.cjs workspace @satellite-mock/e2e exec playwright install --with-deps chromium
      - run: node .yarn/releases/yarn-4.10.3.cjs workspace @satellite-mock/e2e test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: packages/e2e/test-results/
          retention-days: 7

  docker:
    # Build on every PR so a broken image is caught before merge; publishing happens in build.yml.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: satellite-mock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm satellite-mock:ci node -e "
            const { createCanvas } = require('@napi-rs/canvas')
            const c = createCanvas(72, 72)
            const ctx = c.getContext('2d')
            ctx.fillStyle = '#20304a'; ctx.fillRect(0, 0, 72, 72)
            ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.fillText('OK', 10, 40)
            const png = c.toBuffer('image/png')
            if (png.length < 100) throw new Error('png too small: ' + png.length)
            const { data } = ctx.getImageData(0, 0, 72, 72)
            if (![...data].some((v, i) => i % 4 < 3 && v > 200)) throw new Error('no text rendered — fonts missing?')
            console.log('canvas ok, png ' + png.length + ' bytes')
          "
