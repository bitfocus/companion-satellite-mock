version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directories: '/*'
    schedule:
      interval: 'daily'
    # Security updates only — version updates are noisy on a workspace this size.
    open-pull-requests-limit: 0

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
