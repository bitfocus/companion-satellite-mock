services:
  satellite-mock:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.5
    environment:
      # Number of trusted reverse-proxy hops. Must match the deployment, or X-Forwarded-For can be
      # spoofed by clients — see docs/design.md §9.3.
      TRUSTED_PROXY_HOPS: 1
      PUBLIC_ORIGIN: https://satellite-mock.example.com
    expose: ['16623', '16624']

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [satellite-mock]

volumes:
  caddy_data:
  caddy_config:
