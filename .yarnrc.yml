nodeLinker: node-modules
enableGlobalCache: false
enableScripts: true

# Refuse packages published in the last 3 days: a cheap guard against a compromised release being
# pulled in minutes after it lands.
npmMinimalAgeGate: 3d

# Yarn is vendored rather than fetched by corepack, so CI and the Docker build are reproducible and
# need no network beyond the registry.
yarnPath: .yarn/releases/yarn-4.10.3.cjs
